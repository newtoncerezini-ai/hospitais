name: Sincronizar base de saúde

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

concurrency:
  group: health-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.txt
          npm ci

      - name: Sincronizar e validar a planilha
        run: npm run sync:data

      - name: Testar e compilar
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Publicar dados atualizados no repositório
        run: |
          if git diff --quiet -- data/raw/health-units.xlsx data/processed/data-quality.json public/data/health-units.json; then
            echo "A fonte não mudou."
            exit 0
          fi
          git config user.name "health-data-sync[bot]"
          git config user.email "health-data-sync[bot]@users.noreply.github.com"
          git add data/raw/health-units.xlsx data/processed/data-quality.json public/data/health-units.json
          git commit -m "data: sincroniza planilha do Google Drive [skip ci]"
          git push
